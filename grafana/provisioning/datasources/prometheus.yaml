apiVersion: 1

# Источник данных для дашбордов из grafana/dashboards.
# uid фиксирован: панели в JSON ссылаются именно на него, иначе после
# пересоздания источника дашборды останутся без данных.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 3.16.0
      timeInterval: 15s
      # Подсказка для автодополнения метрик в редакторе запросов.
      disableRecordingRules: false
