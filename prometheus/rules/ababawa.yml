# =============================================================================
# Алерты проекта ababawa (Java API + PostgreSQL + TURN).
#
# Доступность целей проверяется общим правилом TargetDown (rules/platform.yml).
# Здесь — то, что видно только по внутренним метрикам: деградация API, давление
# на JVM и базу.
#
# Метки api/postgres/turn и project приходят из prometheus/targets/*/ababawa.yml.
# =============================================================================
groups:
  - name: ababawa
    rules:
      - alert: AbabawaApiErrorRateHigh
        expr: >-
          sum(rate(http_server_requests_seconds_count{job="api",project="ababawa",status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count{job="api",project="ababawa"}[5m])), 1e-9)
          > 0.05
        for: 10m
        labels:
          project: ababawa
          severity: critical
        annotations:
          summary: "ababawa API: более 5% ответов с ошибкой 5xx"
          description: >-
            Доля 5xx за 5 минут — {{ $value | humanizePercentage }}.
            Смотрите логи api: docker logs --tail=200 abavava-api-1
            и Grafana-панель «Ошибки по эндпоинтам».

      - alert: AbabawaApiLatencyHigh
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (
              rate(http_server_requests_seconds_bucket{job="api",project="ababawa"}[5m])
            )
          ) > 1
        for: 10m
        labels:
          project: ababawa
          severity: warning
        annotations:
          summary: "ababawa API: p95 задержки выше 1 с"
          description: >-
            p95 за 5 минут — {{ $value | humanizeDuration }}. Типовые причины:
            медленные запросы к PostgreSQL, нехватка CPU, GC-паузы.

      - alert: AbabawaJvmHeapHigh
        expr: >-
          sum(jvm_memory_used_bytes{job="api",project="ababawa",area="heap"})
          / clamp_min(sum(jvm_memory_max_bytes{job="api",project="ababawa",area="heap"}), 1)
          > 0.9
        for: 10m
        labels:
          project: ababawa
          severity: warning
        annotations:
          summary: "ababawa API: heap занят более чем на 90%"
          description: >-
            Занято {{ $value | humanizePercentage }} heap. Если растёт постоянно —
            утечка или мало памяти контейнеру; если пилообразно — нормальная
            работа GC.

      - alert: AbabawaJvmGcPauseHigh
        expr: >-
          sum(rate(jvm_gc_pause_seconds_sum{job="api",project="ababawa"}[5m]))
          / clamp_min(sum(rate(jvm_gc_pause_seconds_count{job="api",project="ababawa"}[5m])), 1e-9)
          > 0.5
        for: 15m
        labels:
          project: ababawa
          severity: warning
        annotations:
          summary: "ababawa API: средняя пауза GC выше 0,5 с"
          description: >-
            Средняя пауза — {{ $value | humanizeDuration }}. Такие паузы заметны
            пользователю (подвисания чата и WebSocket).

      - alert: AbabawaDbDown
        expr: pg_up{job="postgres",project="ababawa"} == 0
        for: 2m
        labels:
          project: ababawa
          severity: critical
        annotations:
          summary: "ababawa: PostgreSQL недоступен для экспортёра"
          description: >-
            postgres_exporter не может подключиться к базе (pg_up=0). Контейнер
            postgres мог упасть или исчерпан лимит соединений.

      - alert: AbabawaDbConnectionsHigh
        expr: >-
          sum by (project) (pg_stat_database_numbackends{job="postgres",project="ababawa",datname="abavava"})
          / on(project) group_left
          max by (project) (pg_settings_max_connections{job="postgres",project="ababawa"})
          > 0.8
        for: 10m
        labels:
          project: ababawa
          severity: warning
        annotations:
          summary: "ababawa: занято более 80% соединений PostgreSQL"
          description: >-
            Занято {{ $value | humanizePercentage }} max_connections. Дальше —
            «too many clients already» и полный отказ API. Проверьте пул
            приложения: hikaricp_connections_active / hikaricp_connections_max.

      - alert: AbabawaDbLongTransaction
        expr: >-
          max by (project) (pg_stat_activity_max_tx_duration{job="postgres",project="ababawa"}) > 600
        for: 5m
        labels:
          project: ababawa
          severity: warning
        annotations:
          summary: "ababawa: транзакция длится больше 10 минут"
          description: >-
            Самая долгая транзакция — {{ $value | humanizeDuration }}. Такая
            транзакция держит bloat, мешает VACUUM и может блокировать записи.

      - alert: AbabawaDbDeadlocks
        expr: >-
          increase(pg_stat_database_deadlocks{job="postgres",project="ababawa",datname="abavava"}[15m]) > 0
        for: 5m
        labels:
          project: ababawa
          severity: warning
        annotations:
          summary: "ababawa: обнаружены взаимоблокировки в PostgreSQL"
          description: >-
            За 15 минут зафиксировано {{ $value }} deadlock-ов. Часть операций
            пользователей гарантированно завершилась ошибкой.

      # Видеозвонки: клиент не смог авторизоваться на TURN. Метрика снимается с
      # coturn уже на этапе ALLOCATE, поэтому срабатывает раньше, чем жалобы
      # «звонок не соединяется».
      - alert: AbabawaTurnAuthFailures
        expr: >-
          sum(rate(turn_auth_credential_failures{job="turn",project="ababawa",cause=~"expired|integrity_mismatch"}[5m])) > 0.2
        for: 10m
        labels:
          project: ababawa
          severity: warning
        annotations:
          summary: "ababawa: TURN отклоняет креденшелы клиентов"
          description: >-
            {{ $value }} отказов в секунду по причине expired (истёк TTL временных
            креденшелов) или integrity_mismatch (неверный секрет). Симптом —
            звонки «идут», но медиа не устанавливается. Проверьте
            GET /api/v1/config/ice и TURN_URL/TURN_USERNAME/TURN_CREDENTIAL.

  # ---------------------------------------------------------------------------
  # Бизнес- и abuse-метрики приложения (микрометр, префикс ababawa_).
  #
  # Источник — /actuator/prometheus (джоба api). В метках нет IP, email и id,
  # поэтому алерты срабатывают на частоту событий, а не на конкретного
  # пользователя: разбор инцидента — в Grafana (ababawa / Business & Abuse) и
  # Loki. Алерты ничего не блокируют: rate limit и попытки OTP ограничивает
  # приложение, человек/дежурный решает, что делать дальше.
  # ---------------------------------------------------------------------------
  - name: ababawa-business
    rules:
      - alert: AbabawaOtpRateLimitSpike
        expr: >-
          sum(rate(ababawa_auth_otp_requests_total{job="api",project="ababawa",reason="rate_limited"}[5m])) > 0.1
        for: 10m
        labels:
          project: ababawa
          severity: warning
        annotations:
          summary: "ababawa: частые отказы отправки OTP по лимитам"
          description: >-
            {{ $value }} отказов в секунду по причине rate_limited за 5 минут.
            Причины: клиент долбит /auth/resend или /auth/send-code, либо
            resend-cooldown/часовой лимит писем исчерпан. Смотрите панели
            «OTP rate limit по назначению» и «Rate limit HTTP-фильтра по scope».

      - alert: AbabawaOtpVerificationFailuresHigh
        expr: >-
          sum(rate(ababawa_auth_otp_verifications_total{job="api",project="ababawa",result="failure",reason="invalid_code"}[5m])) > 0.1
        for: 10m
        labels:
          project: ababawa
          severity: warning
        annotations:
          summary: "ababawa: массовые неверные коды подтверждения"
          description: >-
            {{ $value }} неверных кодов в секунду за 5 минут. Похоже на перебор
            кода: у аккаунта остаётся max-attempts попыток, затем код гасится.
            Проверьте рост rate_limited по IP в логах и панель «Неуспешные
            проверки OTP по причине».

      - alert: AbabawaLoginFailuresHigh
        expr: >-
          (
            sum(rate(ababawa_auth_logins_total{job="api",project="ababawa",result="failure"}[5m])) > 0.05
            and
            sum(rate(ababawa_auth_logins_total{job="api",project="ababawa",result="failure"}[5m]))
            / clamp_min(sum(rate(ababawa_auth_logins_total{job="api",project="ababawa"}[5m])), 1e-9) > 0.3
          )
        for: 10m
        labels:
          project: ababawa
          severity: warning
        annotations:
          summary: "ababawa: массовые неуспешные попытки входа"
          description: >-
            Более 30% входов завершаются отказом ({{ $value | humanizePercentage }}
            от всех попыток). Чаще всего это перебор паролей; проверьте причину
            на панели «Неуспешные входы по причине» (invalid_credentials).

      - alert: AbabawaAccessDeniedSpike
        expr: >-
          sum(rate(ababawa_security_access_denied_total{job="api",project="ababawa",reason="invalid_token"}[5m])) > 0.5
        for: 5m
        labels:
          project: ababawa
          severity: warning
        annotations:
          summary: "ababawa: всплеск отказов по невалидным токенам"
          description: >-
            {{ $value }} отказов в секунду на защищённых эндпоинтах и рукопожатии
            WebSocket. Похоже на перебор/подбор access-токенов или сломанный
            клиент, который не обновляет токен. Панель «Отказы доступа к
            защищённым endpoint» покажет канал (http/websocket).

      - alert: AbabawaTokenReuseDetected
        expr: >-
          sum(increase(ababawa_auth_refresh_total{job="api",project="ababawa",reason="token_reuse"}[10m])) > 0
        labels:
          project: ababawa
          severity: warning
        annotations:
          summary: "ababawa: обнаружено повторное использование refresh-токена"
          description: >-
            За 10 минут зафиксировано {{ $value }} случаев token_reuse: отозванный
            refresh-токен предъявили повторно. Приложение уже отозвало все сессии
            пользователя; проверьте логи api по строке
            «refresh token reuse detected».

      - alert: AbabawaCallSetupSuccessLow
        expr: >-
          (
            sum(rate(ababawa_calls_accepted_total{job="api",project="ababawa"}[15m]))
            / clamp_min(sum(rate(ababawa_calls_initiated_total{job="api",project="ababawa"}[15m])), 1e-9) < 0.5
            and
            sum(increase(ababawa_calls_initiated_total{job="api",project="ababawa"}[15m])) > 5
          )
        for: 15m
        labels:
          project: ababawa
          severity: warning
        annotations:
          summary: "ababawa: звонки редко принимаются (ниже 50%)"
          description: >-
            Меньше половины звонков доходят до accepted при заметном объёме
            ({{ $value | humanizePercentage }}). Проверьте, доставляется ли
            CALL_INCOMING (WebSocket/push), и панель «Итоги завершённых звонков»
            (missed/rejected).

      - alert: AbabawaSignalingErrorsHigh
        expr: >-
          sum(rate(ababawa_calls_signaling_total{job="api",project="ababawa",result="failure"}[5m])) > 0.2
        for: 10m
        labels:
          project: ababawa
          severity: warning
        annotations:
          summary: "ababawa: много ошибок WebRTC-сигналинга"
          description: >-
            {{ $value }} ошибок в секунду при пересылке offer/answer/candidate.
            Частая причина peer_offline — второй участник отключился, но клиент
            продолжает сигналить; call_finished — гонка после завершения звонка.
            Детали по типам — на панели «Ошибки signaling по причине».

      - alert: AbabawaMailDeliveryFailing
        expr: >-
          sum(rate(ababawa_mail_deliveries_total{job="api",project="ababawa",result="failure"}[5m])) > 0.1
        for: 10m
        labels:
          project: ababawa
          severity: warning
        annotations:
          summary: "ababawa: письма с кодом не доставляются по SMTP"
          description: >-
            {{ $value }} неудачных попыток доставки в секунду. Пользователи не
            получают коды подтверждения и сброса пароля. Текст ошибки — в логе
            api («mail delivery failed»), проверьте SMTP и SPF/DKIM/DMARC по
            docs/DEPLOYMENT.md.

