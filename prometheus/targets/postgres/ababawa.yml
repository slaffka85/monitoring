# Цель джобы `postgres` для проекта ababawa.
#
# Это адрес самого postgres_exporter (host network), а не БД: экспортёр один на
# сервер БД и опрашивает все базы (PG_EXPORTER_AUTO_DISCOVER_DATABASES).
# В БД он ходит через опубликованный на loopback порт abavava — 127.0.0.1:5432.
#
# Второй проект со своей БД = второй контейнер экспортёра на своём порту
# (например 9188) и второй файл в targets/postgres/.
- targets:
    - 127.0.0.1:9187
  labels:
    project: ababawa
    component: postgres
    env: production
