# Цель джобы `postgres` для проекта ababawa.
#
# Это адрес самого postgres_exporter, а не БД: экспортёр один на сервер БД и
# опрашивает все базы (PG_EXPORTER_AUTO_DISCOVER_DATABASES). Контейнер живёт в
# docker-сети прод-стека ababava (постгрес не публикует порт на хост), а наружу
# для скрейпа выставлен только на loopback хоста — 127.0.0.1:9187.
#
# Второй проект со своей БД = второй контейнер экспортёра на своём порту
# (например 9188) и второй файл в targets/postgres/.
- targets:
    - 127.0.0.1:9187
  labels:
    project: ababawa
    component: postgres
    env: production
