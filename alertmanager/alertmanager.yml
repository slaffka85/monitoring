# =============================================================================
# Alertmanager: маршрутизация алертов из Prometheus.
#
# Сейчас доставка не настроена намеренно: алерты видны в UI Alertmanager
# (http://127.0.0.1:9093 через SSH-туннель), но никуда не уходят. Раскомментируйте
# один из блоков в receivers и перезапустите сервис:
#   docker compose restart alertmanager
# =============================================================================

route:
  receiver: default
  # Группировка: один алерт на проект+правило, а не на каждую цель.
  group_by:
    - project
    - alertname
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Всё критичное не ждёт: уходит сразу, повторы чаще.
    - matchers:
        - severity="critical"
      receiver: default
      group_wait: 10s
      repeat_interval: 1h

inhibit_rules:
  # Если цель целиком недоступна (TargetDown, critical), не сыплем warning-ами
  # про её метрики: они всё равно нулевые/отсутствующие.
  - source_matchers:
      - alertname="TargetDown"
    target_matchers:
      - severity="warning"
    equal:
      - project

receivers:
  - name: default
